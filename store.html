<body class="subpage st-page">
  <div class="grain"></div>
  <nav class="subnav">
    <a class="nav-brand" href="index.html"><img src="assets/logo.jpeg" alt=""><span>The Corporate <b>Chai</b></span></a>
    <a class="back-link" href="index.html">← Home</a>

  <header class="st-hero">
    <span class="st-eyebrow">Hacks &amp; eBooks</span>
    <h1>The ₹49 Store</h1>
    <p>Practical guides for your job search and interviews. Pick one and get the file on WhatsApp.</p>
    <div class="st-tabs" id="stTabs"></div>
  </header>

  <main class="st-body" id="stBody"></main>

  <section class="sub-contact">
    <div class="sub-contact-inner">
      <h5>Contact us</h5>
      <div class="social-row" id="subSocial"></div>
      <a class="foot-support" href="support.html"><span aria-hidden="true">🛟</span> Support &amp; Grievance <span aria-hidden="true">→</span></a>

      <div class="foot-bottom" style="border:0">© 2024–2026 The Corporate Chai</div>

  </section>

  <a class="float-wa" id="floatWa" href="#" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C9 3 3.5 8.5 3.5 15.5c0 2.4.7 4.6 1.8 6.5L3 29l7.2-2.3c1.8 1 3.9 1.6 6 1.6 7 0 12.5-5.5 12.5-12.5S23 3 16 3zm0 22.8c-1.9 0-3.7-.5-5.2-1.5l-.4-.2-4.3 1.4 1.4-4.2-.3-.4a10.3 10.3 0 0 1-1.6-5.6c0-5.7 4.7-10.4 10.4-10.4s10.4 4.7 10.4 10.4S21.7 25.8 16 25.8zm5.7-7.8c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.5-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.1c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.2 3.3 5.3 4.6.7.3 1.3.5 1.7.7.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.2-.6-.4z" fill="#fff"/></svg>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script>
    (function () {
      var cfg = SITE_CONFIG;
      var wa = function (m) { return "https://wa.me/" + cfg.whatsapp + "?text=" + encodeURIComponent(m); };
      var price = "₹" + cfg.storePrice;
      document.getElementById("stTabs").innerHTML = cfg.store.map(function (sec) {
        return '<a href="#' + sec.id + '">' + sec.title + '</a>';
      }).join("");
      document.getElementById("stBody").innerHTML = cfg.store.map(function (sec) {
        return '<section class="st-sec" id="' + sec.id + '">' +
          '<div class="st-head"><h2>' + sec.title + '</h2><span>' + sec.items.length + ' guides</span></div>' +
          '<div class="st-grid">' +
          sec.items.map(function (it) {
            return '<a class="st-card" href="' + wa("Hi! I need this file: " + it.name + " — " + price) + '" target="_blank" rel="noopener noreferrer">' +
              '<div class="st-shot"><img loading="lazy" src="' + it.img + '" alt="' + it.name + '"></div>' +
              '<div class="st-meta"><span class="st-name">' + (it.label || it.name) + '</span>' +
              '<span class="st-foot"><b>' + price + '</b><i>Get it →</i></span></div></a>';
          }).join("") + '</div></section>';
      }).join("");
      document.getElementById("floatWa").href = wa("Hi! I have a question about the ₹49 store.");
      if (typeof renderContactRow === "function") renderContactRow(document.getElementById("subSocial"), cfg);
    })();
  </script>
</body>
